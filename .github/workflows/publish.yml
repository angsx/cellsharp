name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore CellSharp.sln --locked-mode
      - run: dotnet build CellSharp.sln --configuration Release --no-restore
      - run: dotnet test CellSharp.sln --configuration Release --no-build
      - run: dotnet pack src/CellSharp/CellSharp.csproj --configuration Release --no-build --output artifacts
      - name: Get temporary NuGet API key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish package and symbols to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish package to GitHub Packages
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/angsx/index.json --skip-duplicate
